# Checks every pull request and every push to main: the same unit tests,
# typechecks and builds that are run by hand before each PR, plus the browser
# journeys against the mock API. Tests that need a running iTop (npm run
# smoke, api-check, npm run e2e:live) are not here: CI has no iTop.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (BFF)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (browser journeys, mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The browser build is tied to the Playwright version, which is pinned
      # exactly in package.json; the cache key follows it.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Journeys (mock API)
        run: npm run e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  security:
    # SEC-02, the same scans as the AWS build (security/README.md): secrets in
    # the Git history, dependencies, infrastructure as code, static analysis.
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the secret scan sees every commit.
          fetch-depth: 0
      - name: Scan
        run: bash security/scan-source.sh
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
          retention-days: 30

  images:
    # SEC-03/04 before production: builds the three images as the AWS build
    # does (not pushed anywhere) and runs the same scan and SBOM on each.
    name: Images (build, scan, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep in step with deploy/aws/buildspec-build.yml.
      NODE_IMAGE: public.ecr.aws/docker/library/node:24.22.1-alpine3.24
      NGINX_IMAGE: public.ecr.aws/docker/library/nginx:1.30.7-alpine3.24
      PHP_IMAGE: public.ecr.aws/docker/library/php:8.4-apache
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -f backend/Dockerfile --build-arg NODE_IMAGE="$NODE_IMAGE" -t arcus-bff:ci .
          docker build frontend --build-arg NODE_IMAGE="$NODE_IMAGE" --build-arg NGINX_IMAGE="$NGINX_IMAGE" \
            --build-arg VITE_BFF_URL=/api --build-arg VITE_DEFAULT_LOCALE=en -t arcus-web:ci
          docker build -f docker/itop-prod/Dockerfile --build-arg PHP_IMAGE="$PHP_IMAGE" -t arcus-itop:ci .
      # Every image is scanned even when an earlier one fails.
      - name: Scan arcus-bff
        if: success() || failure()
        run: bash security/scan-image.sh arcus-bff arcus-bff:ci
      - name: Scan arcus-web
        if: success() || failure()
        run: bash security/scan-image.sh arcus-web arcus-web:ci
      - name: Scan arcus-itop
        if: success() || failure()
        run: bash security/scan-image.sh arcus-itop arcus-itop:ci
      - name: SBOMs of the backend and the frontend
        if: success() || failure()
        run: bash security/sbom-source.sh
      - name: Upload the reports and SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-reports
          path: security-reports/
          retention-days: 30

  signing:
    # SEC-05: the sign and check scripts the AWS build and the server use,
    # against a throwaway registry and a throwaway key (the KMS key only
    # exists in AWS, behind image_signing_enabled).
    name: Image signing (test key)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      COSIGN_PASSWORD: ""
      IMG: localhost:5000/arcus-signing-test
    steps:
      - uses: actions/checkout@v4
      - name: Test images and keys
        run: |
          # Built from scratch: no base image to pull, so no registry rate limits.
          ctx=$(mktemp -d)
          printf 'FROM scratch\nCOPY marker /\n' > "$ctx/Dockerfile"
          echo signed > "$ctx/marker" && docker build -q -t "$IMG:signed" "$ctx"
          echo other > "$ctx/marker" && docker build -q -t "$IMG:other" "$ctx"
          docker push -q "$IMG:signed" && docker push -q "$IMG:other"
          COSIGN=$(bash security/install-cosign.sh)
          mkdir -p "$RUNNER_TEMP/ours" "$RUNNER_TEMP/theirs"
          (cd "$RUNNER_TEMP/ours" && "$COSIGN" generate-key-pair)
          (cd "$RUNNER_TEMP/theirs" && "$COSIGN" generate-key-pair)
      - name: Sign, and sign again (left alone)
        run: |
          bash security/sign-image.sh "$RUNNER_TEMP/ours/cosign.key" "$IMG:signed"
          bash security/sign-image.sh "$RUNNER_TEMP/ours/cosign.key" "$IMG:signed" | grep -q "signed already"
      - name: A signed image passes
        run: bash security/verify-image.sh "$RUNNER_TEMP/ours/cosign.pub" "$IMG:signed"
      - name: An unsigned image is refused
        run: "! bash security/verify-image.sh \"$RUNNER_TEMP/ours/cosign.pub\" \"$IMG:other\""
      - name: Another key's signature is refused
        run: "! bash security/verify-image.sh \"$RUNNER_TEMP/theirs/cosign.pub\" \"$IMG:signed\""
      - name: An image swapped in under a signed tag is refused
        run: |
          docker tag "$IMG:other" "$IMG:signed" && docker push -q "$IMG:signed"
          ! bash security/verify-image.sh "$RUNNER_TEMP/ours/cosign.pub" "$IMG:signed"

  deployment:
    name: Deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The example files leave secrets blank; the compose file refuses blanks.
      ITOP_PASSWORD: ci-placeholder
      SESSION_DB_PASSWORD: ci-placeholder
      ARCUS_ENV_FILE: prod.env.example
      ITOP_ENV_FILE: itop.env.example
    steps:
      - uses: actions/checkout@v4
      - name: Compose files resolve
        working-directory: docker
        run: |
          docker compose -f docker-compose.prod.yml --env-file prod.env.example config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.itop-admin.yml --env-file prod.env.example config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.localtest.yml --env-file prod.env.example config -q
          docker compose -f docker-compose.local.yml config -q
      - name: Shell scripts (shellcheck, executable)
        run: |
          shellcheck docker/itop-prod/*.sh docker/backup/*.sh docker/mysql-init/*.sh
          # -x: the security scripts read their pinned versions from security/versions.env.
          shellcheck -x security/*.sh
          # The backup and MySQL scripts are bind-mounted and run as they are.
          for f in docker/itop-prod/*.sh docker/backup/*.sh docker/mysql-init/*.sh; do
            test -x "$f" || { echo "::error file=$f::not executable (git update-index --chmod=+x $f)"; exit 1; }
          done
      - name: PHP syntax
        run: php -l docker/itop-prod/configure.php
