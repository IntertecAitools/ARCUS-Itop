# Checks every pull request and every push to main: the same unit tests,
# typechecks and builds that are run by hand before each PR, plus the browser
# journeys against the mock API. Tests that need a running iTop (npm run
# smoke, api-check, npm run e2e:live) are not here: CI has no iTop.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (BFF)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (browser journeys, mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The browser build is tied to the Playwright version, which is pinned
      # exactly in package.json; the cache key follows it.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Journeys (mock API)
        run: npm run e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  deployment:
    name: Deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The example files leave secrets blank; the compose file refuses blanks.
      ITOP_PASSWORD: ci-placeholder
      SESSION_DB_PASSWORD: ci-placeholder
      ARCUS_ENV_FILE: prod.env.example
      ITOP_ENV_FILE: itop.env.example
    steps:
      - uses: actions/checkout@v4
      - name: Compose files resolve
        working-directory: docker
        run: |
          docker compose -f docker-compose.prod.yml --env-file prod.env.example config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.itop-admin.yml --env-file prod.env.example config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.localtest.yml --env-file prod.env.example config -q
          docker compose -f docker-compose.local.yml config -q
      - name: Shell scripts (shellcheck, executable)
        run: |
          shellcheck docker/itop-prod/*.sh docker/backup/*.sh docker/mysql-init/*.sh
          # The backup and MySQL scripts are bind-mounted and run as they are.
          for f in docker/itop-prod/*.sh docker/backup/*.sh docker/mysql-init/*.sh; do
            test -x "$f" || { echo "::error file=$f::not executable (git update-index --chmod=+x $f)"; exit 1; }
          done
      - name: PHP syntax
        run: php -l docker/itop-prod/configure.php
