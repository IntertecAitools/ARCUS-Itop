# SLOW -- not for day-to-day use. Use docker-compose.local.yml instead.
#
# This file serves iTop straight from the Windows folder C:\iTop\iTop. Docker
# reads each file across the Windows<->Linux boundary about 100x slower than
# from a volume (120 iTop files: 9.7 s here vs 0.1 s), so every page takes tens
# of seconds to a minute and the BFF times out. Keep it only for editing iTop's
# own source live, which this project never does (see README.md).

services:
  itop:
    build: .
    image: itop-dev:php8.3
    container_name: itop
    ports:
      - "8080:80"
    volumes:
      # The git working tree is served directly, so edits on Windows are live
      # and anything the installer generates (conf/, data/, env-*/) persists.
      - C:\iTop\iTop:/var/www/html
    extra_hosts:
      # Lets the container reach MySQL 8.0 running on the Windows host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
