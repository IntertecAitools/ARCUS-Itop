; iTop-specific PHP settings

; --- Error output -----------------------------------------------------------
; Errors must NEVER be written into the response body. iTop 3.4 on PHP 8.3
; raises "Creation of dynamic property RestResult::$authorized is deprecated"
; inside core/restservices.class.inc.php, and with display_errors on that notice
; is printed BEFORE the JSON — corrupting every REST response that hits the
; path (core/check_credentials is the one the BFF health check uses) and also
; breaking header(), since output has already started.
;
; Sending them to the log instead keeps the diagnostics without breaking the
; API contract. Set display_errors=STDOUT temporarily if you need to see a
; fatal in the browser while debugging a page.
display_errors = Off
log_errors = On
error_log = /dev/stderr
; Deprecations are noise here: they come from iTop's own code, not ours.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Installer minimum is memory_limit=32M, but the data loader and PDF/graph
; export need far more; 512M is the value Combodo recommends.
memory_limit = 512M

; setup/ajax.dataloader.php raises this itself, but only if allowed to
max_execution_time = 300
max_input_time = 300

; Kept under the host MySQL max_allowed_packet (64M) so large attachments
; survive the INSERT. post_max_size MUST be strictly greater than upload_max_filesize,
; otherwise the installer raises a warning (setuputils.class.inc.php:310)
upload_max_filesize = 48M
post_max_size = 50M

; Large object forms (e.g. a Ticket with many linked CIs) blow past the default 1000
max_input_vars = 5000

date.timezone = UTC

; The Debian PHP image leaves this empty, which makes the installer warn that
; sessions may not be saved. Point it at a dir owned by www-data.
session.save_path = "/var/lib/php/sessions"

; Keep the graph/PDF exports from choking on deep object hierarchies
max_file_uploads = 50

opcache.enable = 1
; 7.7k PHP files in the tree, so 20000 slots is ample; 256M gives headroom
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; iTop generates PHP into data/ at setup time - let OPcache notice the changes
opcache.validate_timestamps = 1
; The working tree is a Windows bind mount, measured at ~3.2ms per file read
; against 0.02ms on container-local disk. At the default freq=2 OPcache re-stats
; every file every 2 seconds, which is what made page loads take ~55s.
; 300 keeps live editing working - edits appear within 5 minutes - while
; removing almost all of the stat traffic. Drop it back to 2 if you are
; actively iterating on PHP and want instant feedback.
opcache.revalidate_freq = 300

; Same reason: cache resolved paths for 10 minutes instead of 2, so the slow
; mount is walked far less often.
realpath_cache_size = 8192K
realpath_cache_ttl = 600
