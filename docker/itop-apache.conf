<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    # iTop ships .htaccess files that deny access to conf/, data/, log/ etc.
    # Without AllowOverride All those protections are silently ignored.
    AllowOverride All
    Require all granted
</Directory>

# Bind mounts from Windows report mtimes with low resolution and no inode
# reuse; sendfile/mmap cause Apache to serve stale or truncated assets.
EnableSendfile Off
EnableMMAP Off

DirectoryIndex index.php index.html
