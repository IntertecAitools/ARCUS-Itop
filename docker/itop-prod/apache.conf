# iTop in production. Nobody uses iTop's own screens, so Apache serves only
# the three web services the BFF calls; everything else (the console, the
# portal, setup/, cron.php over HTTP) answers 403.
#
# Emergency access to the console: start the container with ITOP_ADMIN_UI=true
# (docker/docker-compose.prod.itop-admin.yml does it), which defines
# ITOP_ADMIN_UI below. docs/deployment.md, "Emergency access to iTop".

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    # iTop ships .htaccess files that deny access to conf/, data/, log/ etc.
    AllowOverride All
    Require all denied
</Directory>

<IfDefine !ITOP_ADMIN_UI>
    # Location sections are applied after Directory and .htaccess, so this
    # opens exactly these files and nothing else.
    <LocationMatch "^/webservices/(rest|export-v2|import)\.php$">
        Require all granted
    </LocationMatch>
</IfDefine>

<IfDefine ITOP_ADMIN_UI>
    <Directory /var/www/html>
        Require all granted
    </Directory>
</IfDefine>

DirectoryIndex index.php index.html
