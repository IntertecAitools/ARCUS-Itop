misconfigurations:
  # --- False positives (no expiry)
  # The public access block is set to true on all four settings, for both
  # buckets; Trivy does not follow the for_each map and sees them unset.
  - id: AWS-0086
    paths: ["deploy/aws/terraform/main.tf"]
    statement: False positive, all four public access settings are true (for_each over both buckets).
  - id: AWS-0087
    paths: ["deploy/aws/terraform/main.tf"]
    statement: False positive, all four public access settings are true (for_each over both buckets).
  - id: AWS-0091
    paths: ["deploy/aws/terraform/main.tf"]
    statement: False positive, all four public access settings are true (for_each over both buckets).
  - id: AWS-0093
    paths: ["deploy/aws/terraform/main.tf"]
    statement: False positive, all four public access settings are true (for_each over both buckets).
  # docker/Dockerfile is the local development image (docker-compose.local.yml),
  # never deployed.
  - id: DS-0002
    paths: ["docker/Dockerfile"]
    statement: Local development image only, never deployed.

  # --- Accepted risks, reviewed again on the expiry date. Accepted 2026-11-23.
  # Buckets use S3-managed encryption (SSE-S3, AES-256). A customer-managed
  # key adds key-policy control, not stronger encryption; not needed for
  # release bundles and backups that only our roles can read.
  - id: AWS-0132
    paths: ["deploy/aws/terraform/main.tf"]
    statement: SSE-S3 (AES-256) is enough for bundles and backups readable only by our roles.
    expired_at: 2027-11-23
  # The approval/alert topic carries pipeline notices (commit id and message),
  # no customer data. Encrypting it needs a KMS key EventBridge and CloudWatch may use.
  - id: AWS-0095
    paths: ["deploy/aws/terraform/main.tf"]
    statement: Topic carries pipeline notices only, no customer data.
    expired_at: 2027-02-23
  # The server reaches ECR, S3, SSM, Bedrock and Microsoft 365 mail, whose
  # addresses change; inbound is CloudFront-only. Restricting egress to those
  # ports and prefix lists is a planned change to the live server.
  - id: AWS-0104
    paths: ["deploy/aws/terraform/main.tf"]
    statement: Outbound to AWS services and Microsoft 365 with changing addresses; inbound is CloudFront-only.
    expired_at: 2027-02-23
  # No AWS WAF in front of CloudFront yet (AWS Shield Standard applies; the
  # BFF limits sign-in attempts). WAF is its own readiness item, with a cost.
  - id: AWS-0011
    paths: ["deploy/aws/terraform/cdn.tf"]
    statement: WAF not yet in place; Shield Standard and BFF rate limits apply. Separate readiness item.
    expired_at: 2027-02-23
  # The images start as root and drop privileges: Apache and nginx run their
  # workers as www-data / nginx. (The BFF image already runs as `node`.)
  # Moving to non-root master processes changes ports and file ownership.
  - id: DS-0002
    paths: ["docker/itop-prod/Dockerfile", "frontend/Dockerfile"]
    statement: Apache and nginx drop to unprivileged workers; non-root masters need port and ownership changes.
    expired_at: 2027-02-23
