  <g fill="#ffffff" fill-opacity="0.45">
    <rect x="170" y="298" width="120" height="8"/>
    <rect x="170" y="352" width="160" height="8"/>
    <rect x="170" y="406" width="100" height="8"/>
  </g>
  <circle cx="620" cy="302" r="6" fill="#86efac"/>
  <circle cx="620" cy="356" r="6" fill="#fcd34d"/>
  <circle cx="620" cy="410" r="6" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="370" y="510" width="60" height="70" fill="#1b251e"/>
  <rect x="290" y="580" width="220" height="12" fill="#1b251e"/>
  <!-- floating request card -->
  <rect x="640" y="250" width="420" height="300" fill="#f5f5f1"/>
  <rect x="640" y="250" width="420" height="56" fill="#e3e6e1"/>
  <rect x="668" y="273" width="110" height="10" fill="#18201a" fill-opacity="0.55"/>
  <rect x="668" y="336" width="300" height="14" fill="#18201a"/>
  <rect x="668" y="368" width="340" height="8" fill="#18201a" fill-opacity="0.3"/>
  <rect x="668" y="386" width="310" height="8" fill="#18201a" fill-opacity="0.3"/>
  <rect x="668" y="404" width="250" height="8" fill="#18201a" fill-opacity="0.3"/>
  <rect x="668" y="470" width="150" height="44" fill="#18201a"/>
  <rect x="690" y="488" width="106" height="8" fill="#ffffff"/>
