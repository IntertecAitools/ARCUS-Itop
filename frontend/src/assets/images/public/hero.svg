<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-hidden="true">
  <!-- Abstract placeholder: replace with your organisation's own photo (see README.md). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3a2f"/>
      <stop offset="1" stop-color="#0e1511"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#5d7d66" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5d7d66" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- a screen, seen from the desk -->
  <rect x="120" y="150" width="560" height="360" fill="#141d17" stroke="#6b8574" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="150" y="185" width="200" height="10" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="150" y="215" width="320" height="6" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="150" y="233" width="280" height="6" fill="#ffffff" fill-opacity="0.15"/>
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="150" y="280" width="500" height="44"/>
    <rect x="150" y="334" width="500" height="44"/>
    <rect x="150" y="388" width="500" height="44"/>
